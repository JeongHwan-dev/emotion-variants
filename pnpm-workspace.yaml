packages:
  - "."
  - "examples/*"
  - "docs"

# Moved from .npmrc: pnpm 11+ restricts .npmrc to auth/registry settings only.
ignoreWorkspaceRootCheck: true

# pnpm 10+ blocks dependency lifecycle scripts by default. esbuild needs its
# postinstall to place the platform binary.
allowBuilds:
  esbuild: true

# Security patches for transitive dependencies. pnpm 12 reads overrides
# from here only; the package.json "pnpm" field is ignored.
overrides:
  "@storybook/core": "^8.6.19"
  "brace-expansion@1": "^1.1.20"
  "brace-expansion@2": "^2.1.6"
  "brace-expansion@5": "^5.0.11"
  browserslist: "^4.28.7"
  esbuild: "^0.25.0"
  fast-uri: "^3.1.4"
  "js-yaml@4": "^4.3.0"
  launch-editor: "^2.14.2"
  lodash: "^4.18.1"
  "minimatch@3": "^3.1.4"
  "minimatch@9": "^9.0.7"
  "nanoid@3": "^3.3.16"
  "picomatch@2": "^2.3.2"
  "picomatch@4": "^4.0.4"
  postcss: "^8.5.12"
  preact: "^10.28.2"
  rollup: "^4.59.0"
  shell-quote: "^1.11.0"
  source-map-js: "^1.2.2"
  storybook: "^8.6.19"
  tinypool: "^2.1.2"
  tmp: "^0.2.6"
  undici: "^7.18.2"
  vite: "^6.4.4"
  "ws@8": "^8.21.0"
  zod: "^4.6.6"
