packages:
  - "."
  - "examples/*"
  - "docs"

# Moved from .npmrc: pnpm 11+ restricts .npmrc to auth/registry settings only.
ignoreWorkspaceRootCheck: true

# pnpm 10+ blocks dependency lifecycle scripts by default. esbuild needs its
# postinstall to place the platform binary.
allowBuilds:
  esbuild: true

# vitest 3 pins tinypool ^1.1.1, which has no patched 1.x release for its
# critical advisories; force the fixed 2.x line until vitest is upgraded.
overrides:
  tinypool: "^2.1.2"
  vite: "^6.4.4"
