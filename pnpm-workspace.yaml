packages:
  - "."
  - "examples/*"
  - "docs"

# Moved from .npmrc: pnpm 11+ restricts .npmrc to auth/registry settings only.
ignoreWorkspaceRootCheck: true

# pnpm 10+ blocks dependency lifecycle scripts by default. esbuild needs its
# postinstall to place the platform binary. es5-ext (pulled in by Sandpack in
# docs) only prints a message from its postinstall, so it stays blocked.
allowBuilds:
  es5-ext: false
  esbuild: true

overrides:
  vite: "^6.4.4"
